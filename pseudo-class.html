<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class</title>

    <style>
        a:link {
            color: green;
        }

        a:visited {
            color: red;
        }

        button:active {
            background: yellow;
        }

        button:hover {
            background: blue;
        }

        /* input:focus {
            outline: none;
            border-color: blueviolet;
        } */


        .input-group {
            position: relative;
        }

        .input-group label {
            position: absolute;
            left: 5px;
            color: gray;
        }

        .input-group input:focus {
            outline: none;
            border-color: red;
        }

        .input-group input:focus+label {
            top: -5px;
            font-size: 10px;
            background-color: white;
        }

        input:checked + label {
            color: red;
            text-decoration: line-through;
        }

        form {
            margin-top: 100px;
        }

        input:invalid {
            outline: none;
            border-color: red;
        }

        input:valid {
            outline: none;
            border-color: green;
        }
    </style>

</head>

<body>

    <a href="https://www.google.com/">Google</a>
    <a href="https://facebook.com/">Facebook</a>
    <a href="https://instagram.com/">Instagram</a>


    <button>Click</button>

    <br>

    <div class="input-group">
        <input type="text" id="name">
        <label for="name">Name</label>
    </div>

    <div class="input">
        <input type="checkbox" id="name">
        <label for="name">Name</label>
    </div>

    <form action="#">
        <div class="input">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <button>submit</button>
    </form>

</body>

</html>
