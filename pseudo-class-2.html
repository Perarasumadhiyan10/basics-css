<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class</title>

    <style>
        div p {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        div p:first-child {
            color: red;
        }

        div p:last-child {
            color: red;
        }

        div p:nth-child(3n) {
            color: blue;
        }

        div p:not(:last-child) {
            margin-bottom: 10px;
        }


        .circle {
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            border-radius: 50%;
            position: relative;
        }

        .circle::before {
            content: '';
        }

        .circle::after {
            content: '';
            display: block;
            background-color: black;
            width: 10px;
            height: 10px;
            position: absolute;
            bottom: 0;
            left: 50%;
        }
    </style>

</head>

<body>

    <div class="circle">

    </div>
