<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>

    <style>

        /* .parent > p {
            color: red;
        } */

        /* h2 + p {
            color: blue;
        }         */

        h2 ~ p {
            color: blue;
        }
    </style>

</head>
<body>

    <div class="parent">
        <h2>Hi</h2>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <div>
            <h4>Welcome</h4>
            <p>4</p>
        </div>
    </div>
    
</body>
</html>
